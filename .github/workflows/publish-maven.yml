# 把 globecore 的 AAR 以 Maven 布局发布到 GitHub Pages（gh-pages:/maven）
# 消费者只需在自己的仓库列表里加 https://<owner>.github.io/GlobeCore/maven 即可按坐标自动下载。
#
# 关键：native 的第三方 .a 不入 git，CI 无法现编 GDAL，故先下载 Release 里已构建好的
# globecore-prebuilt-libs-*.zip 解压到仓库根（.a/生成头/assets-proj 就位），再 assembleRelease。
name: Publish Maven (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "携带 prebuilt-libs zip 的 Release tag（如 v0.1.2.0）"
        required: true
        default: "v0.1.2.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        # ubuntu-latest 已预装 SDK/cmdline-tools；此处仅接受许可，platforms;android-37、
        # ndk;28.2.x、cmake 等由 AGP 按需自动下载（避免 setup-android@v3 的 legacy 'tools' 包缺失问题）
        run: |
          SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --version && echo "sdkmanager ok"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download prebuilt native libs from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" \
            --pattern "globecore-prebuilt-libs-*.zip" \
            --clobber
          unzip -o globecore-prebuilt-libs-*.zip
          echo "jniLibs:"; ls -1 globecore/src/main/cpp/jniLibs/*/*.a | head

      - name: Grant gradlew execute
        run: chmod +x gradlew

      - name: Build & publish AAR to local maven repo (globecore/build/repo)
        run: ./gradlew --no-daemon :globecore:publish

      - name: Deploy maven repo to GitHub Pages (gh-pages:/maven)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./globecore/build/repo
          destination_dir: maven
          keep_files: true
          commit_message: "Deploy maven artifacts (${{ steps.tag.outputs.tag }})"
