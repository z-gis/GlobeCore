# 把 globecore 的 AAR 以 Maven 布局发布到 GitHub Pages（gh-pages:/maven）。
# 消费者在 repositories 里加 https://<owner>.github.io/GlobeCore/maven 即可按坐标自动下载。
#
# 设计（不依赖 prebuilt-libs zip）：native 的三方 .a 不入 git，CI 现编 GDAL 不现实（与项目
# 「本地构建 + Release 托管、CI 不做全量编译」的决策一致）。因此 **AAR 在本地构建**：
#   gradlew :globecore:publish   →  globecore/build/repo（maven 布局）
# 再把该 repo 目录打成 **globecore-maven-<version>.zip** 作为附件上传到对应 GitHub Release。
# 本工作流只负责：从 Release 取该 maven zip → 叠加部署到 gh-pages:/maven（保留历史版本、
# 重生成 maven-metadata.xml 与校验和）。runner 无需 NDK/native 工具链。
name: Publish Maven (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "携带 globecore-maven-*.zip 的 Release tag（如 v0.1.2.0）"
        required: true
        default: "v0.1.2.0"
  release:
    types: [published]

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Download maven repo zip from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --pattern "globecore-maven-*.zip" --clobber
          mkdir -p repo
          unzip -o globecore-maven-*.zip -d repo
          echo "--- repo layout ---"
          find repo -maxdepth 4 -type d | sort | head -n 40

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gp
          fetch-depth: 1

      - name: Overlay artifacts + regenerate maven-metadata
        run: |
          set -euo pipefail
          base="gp/maven/com/zys/globecore"
          # 1) 叠加新产物（保留 gh-pages 上既有版本目录，不清空）
          mkdir -p gp/maven
          cp -rv repo/* gp/maven/
          [ -f gp/.nojekyll ] || touch gp/.nojekyll
          # 2) 依据 maven 目录下全部版本重算 metadata（latest=最高版本）
          mapfile -t VERS < <(find "$base" -maxdepth 1 -mindepth 1 -type d \
              -regextype posix-extended -regex '.*/[0-9]+(\.[0-9]+)+' -printf '%f\n' | sort -V)
          if [ "${#VERS[@]}" -eq 0 ]; then echo "no versions found under $base" >&2; exit 1; fi
          LATEST="${VERS[-1]}"
          TS="$(date -u +%Y%m%d%H%M%S)"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<metadata>'
            echo '  <groupId>com.zys</groupId>'
            echo '  <artifactId>globecore</artifactId>'
            echo '  <versioning>'
            echo "    <latest>${LATEST}</latest>"
            echo "    <release>${LATEST}</release>"
            echo '    <versions>'
            for v in "${VERS[@]}"; do echo "      <version>${v}</version>"; done
            echo '    </versions>'
            echo "    <lastUpdated>${TS}</lastUpdated>"
            echo '  </versioning>'
            echo '</metadata>'
          } > "$base/maven-metadata.xml"
          for a in md5 sha1 sha256 sha512; do
            case "$a" in
              md5)   h=$(md5sum    "$base/maven-metadata.xml" | cut -d' ' -f1) ;;
              sha1)  h=$(sha1sum   "$base/maven-metadata.xml" | cut -d' ' -f1) ;;
              sha256) h=$(sha256sum "$base/maven-metadata.xml" | cut -d' ' -f1) ;;
              sha512) h=$(sha512sum "$base/maven-metadata.xml" | cut -d' ' -f1) ;;
            esac
            printf '%s' "$h" > "$base/maven-metadata.xml.$a"
          done
          echo "metadata versions: ${VERS[*]} | latest: ${LATEST}"

      - name: EOL / checksum guard
        run: |
          set -euo pipefail
          cd gp
          git config core.autocrlf false
          git config core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 行尾一致性审计：index 与 worktree 的 EOL 类型不同会让 Gradle 校验和失配
          bad=0
          while IFS= read -r f1 f2 rest; do
            ie=${f1#i/}; we=${f2#w/}
            if [ -n "$f1" ] && [ "$ie" != "$we" ]; then echo "EOL mismatch ($ie vs $we): $rest"; bad=1; fi
          done < <(git ls-files --eol | grep -E 'aar|pom|module|metadata|sources' || true)
          [ "$bad" -eq 0 ] || { echo "aborting to keep checksums valid" >&2; exit 1; }

      - name: Commit & push gh-pages
        run: |
          set -euo pipefail
          cd gp
          if git diff --cached --quiet; then
            echo "no changes (repo already up-to-date on gh-pages)"
          else
            git commit -q -m "Deploy maven artifacts (${{ steps.tag.outputs.tag }})"
            git push origin HEAD:refs/heads/gh-pages
          fi
          echo "gh-pages head = $(git rev-parse HEAD)"

      - name: Wait for Pages build & verify served checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git -C gp rev-parse HEAD)
          for i in $(seq 1 30); do
            st=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '.status') || st=unknown
            cs=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '.commit') || cs=
            echo "poll $i status=$st commit=${cs:0:7}"
            if [ "$st" = "built" ] && [ "$cs" = "$sha" ]; then break; fi
            sleep 10
          done
          ver="${{ steps.tag.outputs.tag }}"; ver="${ver#v}"
          OWNER="${GITHUB_REPOSITORY%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          echo "verify served sha1 for ${ver} aar"
          srv=$(curl -fsS "https://${OWNER}.github.io/${REPO}/maven/com/zys/globecore/${ver}/globecore-${ver}.aar.sha1?nc=$RANDOM" || true)
          loc=$(cat "gp/maven/com/zys/globecore/${ver}/globecore-${ver}.aar.sha1" || echo "")
          echo "served=${srv:0:12} local=${loc:0:12}"
